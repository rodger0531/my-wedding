<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="preload"
      href="/fonts/better-together-spaced.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!--
      Halimun is only declared in fonts_2.css (imported by LandingPage) and only
      applied for English, so it is never used on the welcome screen. Prefetch
      keeps it warm for the /main navigation without competing with first paint.
    -->
    <link
      rel="prefetch"
      href="/fonts/halimun.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />

    <link
      rel="preload"
      as="image"
      href="/welcome_hands.svg"
      fetchpriority="high"
    />

    <title>R & C Wedding</title>
    <link rel="icon" type="image/svg+xml" href="/rings.png" />
    <meta
      name="description"
      content="我們要結婚了！誠摯邀請您與 Rodger & Claire 一同見證並參與我們的婚禮，活動資訊、流程與回覆出席請點此查看。"
    />
    <meta
      property="og:title"
      content="Rodger & Claire · Wedding Celebration 2026"
    />
    <meta
      property="og:description"
      content="我們要結婚了！誠摯邀請您與 Rodger & Claire 一同見證並參與我們的婚禮，活動資訊、流程與回覆出席請點此查看。"
    />
    <meta
      property="og:image"
      content="https://rodgerclaire.wedding/preview.webp"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/webp" />
    <meta property="og:url" content="https://rodgerclaire.wedding/" />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
